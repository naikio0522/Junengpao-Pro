name: Build 巨能跑pro版 Installer (Windows)

# Builds a self-contained Windows installer (NSIS .exe) for the
# Electron + FastAPI + ffmpeg architecture. Users double-click the
# resulting Setup.exe — no Python required.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (optional; defaults to v<frontend/package.json version>)"
        required: false
        default: ""
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate 0.x release version
        id: release_meta
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^0\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Only stable 0.x versions can be published: $version"
          }
          $tag = "v$version"
          if ($env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne $tag) {
            throw "Pushed tag $($env:REF_NAME) does not match package version $tag"
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and
              -not [string]::IsNullOrWhiteSpace($env:REQUESTED_TAG) -and
              $env:REQUESTED_TAG -ne $tag) {
            throw "Requested tag $($env:REQUESTED_TAG) does not match package version $tag"
          }
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      # ── Python toolchain ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps + PyInstaller
        shell: pwsh
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Cache offline speech model for packaging
        shell: pwsh
        working-directory: backend
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base', revision='ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66')"
          if ($LASTEXITCODE -ne 0) { throw "Offline speech model download failed" }

      # ── Bundle ffmpeg next to the backend so PyInstaller sweeps it in ────
      - name: Download FFmpeg static build
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-full_build.7z"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          7z x ffmpeg.7z -offmpeg-extracted -y
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg extraction failed" }
          $bin = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty DirectoryName
          New-Item -ItemType Directory -Force -Path backend/ffmpeg | Out-Null
          Copy-Item "$bin\ffmpeg.exe"  backend/ffmpeg/
          Copy-Item "$bin\ffprobe.exe" backend/ffmpeg/
          if ((Get-FileHash backend/ffmpeg/ffmpeg.exe).Hash -ne "09948D4CDD0650DA6FF5A87577469F2A218DC2615AE379F8F734D24C49DE0F73") { throw "FFmpeg differs from verified build" }
          if ((Get-FileHash backend/ffmpeg/ffprobe.exe).Hash -ne "A6618E99BB58869DED3C6F37B53AA1A8D701C3591DBB7B5B317D47369C112BE2") { throw "FFprobe differs from verified build" }

      - name: Test backend regressions
        working-directory: backend
        run: python -m pytest tests -q

      # ── Backend → single .exe (ffmpeg + uvicorn + fastapi bundled) ───────
      - name: Build backend binary
        shell: pwsh
        working-directory: backend
        run: pyinstaller --clean videomatrix-backend.spec

      - name: Verify packaged backend identity, shutdown and offline ASR
        shell: pwsh
        working-directory: backend
        run: |
          $env:VIDEOMATRIX_TEST_BINARY = (Resolve-Path dist/videomatrix-backend.exe).Path
          python -m pytest tests/test_runtime_startup.py tests/test_packaged_offline_asr.py -q
          if ($LASTEXITCODE -ne 0) { throw "Packaged backend smoke tests failed" }

      # ── Node toolchain ───────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build renderer / main / preload
        working-directory: frontend
        run: |
          node --test tests/runtime.test.cjs tests/update-channel.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      # ── Frontend installer (NSIS) — pulls backend exe in via extraResources
      - name: Package Electron app
        working-directory: frontend
        run: npx electron-builder --win --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoMatrix-windows-installer
          path: frontend/release/*.exe

      - name: Publish Windows installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          $installer = Get-Item -LiteralPath "frontend/release/巨能跑pro版.Setup.$env:RELEASE_VERSION.exe"
          # GitHub strips non-ASCII release asset filename characters. Publish
          # under the stable ASCII compatibility name accepted by 0.x clients.
          $releaseAsset = Join-Path $installer.DirectoryName "VideoMatrix.Setup.$env:RELEASE_VERSION.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $releaseAsset
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Could not check for existing release $tag" }
          $releases = ($releasesJson | Out-String) | ConvertFrom-Json
          $existing = @($releases | Where-Object { $_.tag_name -eq $tag })
          if ($existing.Count -gt 0) {
            throw "Release $tag already exists. Bump the version instead of replacing its installer."
          }
          $mainHead = (gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq '.sha' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $mainHead -ne $env:GITHUB_SHA) {
            throw "This build was superseded by another main commit; refusing to publish $tag."
          }
          gh release create $tag $releaseAsset --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA --title "巨能跑pro版 $env:RELEASE_VERSION" `
            --notes "Self-contained Windows installer (Electron + FastAPI + ffmpeg, no Python required)."
          if ($LASTEXITCODE -ne 0) { throw "Could not publish Windows installer for $tag" }

  publish-channel:
    needs: build
    uses: ./.github/workflows/publish-update-channel.yml
    with:
      release_tag: ${{ needs.build.outputs.release_tag }}
    permissions:
      contents: write
